<!doctype html>

<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content, scripts)"
      lang="en"
      class="h-100">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<meta name="description" content="">

	<title th:text="|My Book Library - ${title}|">Book Library</title>

	<link rel="stylesheet" th:href="@{/bootstrap/4.3.1/css/bootstrap.css}" >
	<link rel="stylesheet" th:href="@{/css/colors.css}" >
	<link rel="stylesheet" th:href="@{/css/footer.css}">

	<style>
		.bd-placeholder-img {
			font-size: 1.125rem;
			text-anchor: middle;
			-webkit-user-select: none;
			-moz-user-select: none;
			-ms-user-select: none;
			user-select: none;
		}

		@media (min-width: 768px) {
			.bd-placeholder-img-lg {
				font-size: 3.5rem;
			}
		}
	</style>
</head>

<body class="d-flex flex-column h-100">
<header>
	<nav class="navbar navbar-expand-md navbar-dark fixed-top bg-royal-blue">
		<a class="navbar-brand" href="/">My book library</a>
		<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarCollapse"
		        aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
			<span class="navbar-toggler-icon"></span>
		</button>

		<div class="collapse navbar-collapse" id="navbarCollapse">
			<ul class="navbar-nav mr-auto">
				<li class="nav-item active">
					<a class="nav-link" href="/">Home <span class="sr-only">(current)</span></a>
				</li>
				<li class="nav-item">
					<a class="nav-link" href="/books">Books</a>
				</li>
				<li class="nav-item">
					<a class="nav-link" href="/comic-books">Comic books</a>
				</li>
				<li class="nav-item">
					<a class="nav-link" href="/magazines">Magazines</a>
				</li>
				<li class="nav-item">
					<a class="nav-link disabled" href="#" tabindex="-1" aria-disabled="true">Disabled</a>
				</li>
			</ul>
			<form class="form-inline mt-2 mt-md-0">
				<input class="form-control mr-sm-2" type="text" placeholder="Search" aria-label="Search">
				<button class="btn btn-outline-success my-2 my-sm-0" type="submit">Search</button>
			</form>
		</div>
	</nav>
</header>

<!-- Begin page content -->
<main role="main" class="flex-shrink-0">
	<div class="container">
		<div th:replace="${content}">
			<p>Contenuto predefinito</p>
		</div>
	</div>
</main>

<footer class="bg-royal-blue mt-auto py-3">
	<div class="container">
		<span class="text-muted">Place sticky footer content here.</span>
	</div>
</footer>

<script src="/jquery/3.3.1/jquery.slim.js"></script>
<script src="/bootstrap/4.3.1/js/bootstrap.bundle.js"></script>

<th:block th:replace="${scripts} ?: ~{}"></th:block>
</body>
</html>
